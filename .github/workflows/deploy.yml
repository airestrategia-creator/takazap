name: Deploy

# Publica sozinho a cada push no main:
#  - painel  -> Cloudflare Pages (www.takazap.com.br)
# O backend NÃO sai daqui: ele roda numa VM da Oracle Cloud, como serviço
# systemd, e é atualizado por SSH (git pull + systemctl restart takazap).
# Motivo: a conexão do WhatsApp precisa de processo sempre ligado, então o
# deploy é feito no servidor, não recriado a cada push.
# As senhas ficam em Settings > Secrets and variables > Actions (nunca no código).

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pelo site do GitHub

jobs:
  painel:
    name: Painel (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Compilar o painel
        working-directory: frontend
        run: npm run build
      - name: Publicar no Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.120.1 pages deploy dist --project-name=takazap --branch=main --commit-dirty=true
