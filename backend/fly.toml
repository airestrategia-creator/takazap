# fly.toml app configuration file generated for takazap-backend on 2026-08-11T08:31:08-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'takazap-backend'
primary_region = 'gru'

[build]
[env]
  PORT = '3333'
  WHATSAPP_AUTH_DIR = '/app/storage/whatsapp-auth'

[[mounts]]
  source = 'whatsapp_storage'
  destination = '/app/storage'

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
